    blurb: "Apaixonado por código limpo e aprendizado de novas tecnologias."
    photoUrl: "https://github.com/JoaoCominii.png"
    about: "Estudante de Ciência da Computação na PUC Minas, 5º semestre, com foco em desenvolvimento de software e uma rotina de aprendizado muito guiada por projetos reais, aprendo melhor construindo do que só estudando teoria. Trabalho principalmente com Java, JavaScript/TypeScript, Node.js, React e Flutter, com experiência em APIs REST, Firebase, SQL e Git. Meu projeto principal é o Folio, um app mobile full stack que estou desenvolvendo do zero com Flutter no mobile, Node.js + TypeScript no backend e Firebase na nuvem, onde cuido de toda a arquitetura de forma autônoma. Também uso ferramentas de IA generativa como Claude e Cursor no dia a dia do desenvolvimento, não como atalho, mas como par de raciocínio para resolver problemas com mais profundidade. Fora do código, sou fluente em inglês e italiano, o que me permite consumir documentação técnica na fonte e colaborar com times internacionais sem barreira. Estou sempre buscando novos desafios, projetos e oportunidades para crescer. Se quiser conversar, é só chamar."
